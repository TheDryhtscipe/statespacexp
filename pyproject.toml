[project]
name = "sst"
version = "0.1.0"
description = "State-tracking tasks and length-generalisation evaluation for RNN/SSM experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sst"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
